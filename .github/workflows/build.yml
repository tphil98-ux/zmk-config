name: Build ZMK firmware

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: Build ${{ matrix.shield }}
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: nice_nano_v2
            shield: corne_left
          - board: nice_nano_v2
            shield: corne_right

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init west workspace
        shell: bash
        run: |
          set -eux
          rm -rf /tmp/zmk-config
          mkdir -p /tmp/zmk-config
          cp -R "${GITHUB_WORKSPACE}/config" /tmp/zmk-config/config
          cd /tmp/zmk-config
          west init -l config
          west update --fetch-opt=--filter=tree:0
          west zephyr-export

      - name: Build ${{ matrix.shield }}
        shell: bash
        working-directory: /tmp/zmk-config
        run: |
          set -eux
          west build -s zmk/app -d /tmp/build -b "${{ matrix.board }}" \
            -- -DZMK_CONFIG=/tmp/zmk-config/config \
               -DSHIELD="${{ matrix.shield }}"

      - name: Collect artifact
        shell: bash
        run: |
          set -eux
          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          cp /tmp/build/zephyr/zmk.uf2 "${GITHUB_WORKSPACE}/artifacts/${{ matrix.shield }}.uf2"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.shield }}
          path: ${{ github.workspace }}/artifacts/
          if-no-files-found: error
